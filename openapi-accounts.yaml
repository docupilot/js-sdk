components:
  schemas:
    AcceptInvite:
      type: object
      properties:
        workspace_unique_key:
          type: string
      required:
      - workspace_unique_key
    AddonPricingInfo:
      type: object
      properties:
        addon_id:
          type: string
        type:
          enum:
          - recurring
          - one_time
          type: string
        allowed_quantities:
          type: array
          items:
            type: integer
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/AddonTier'
      required:
      - addon_id
      - allowed_quantities
      - tiers
      - type
    AddonPurchase:
      type: object
      properties:
        addon_id:
          enum:
          - esignature
          - signnow
          type: string
        quantity:
          type: integer
      required:
      - addon_id
      - quantity
    AddonTier:
      type: object
      properties:
        upto:
          type: string
        price:
          type: number
          format: double
      required:
      - price
      - upto
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        hosted_url:
          type: string
          readOnly: true
      required:
      - hosted_url
      - id
    CSMDetails:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        phone_number:
          type: string
          maxLength: 20
      required:
      - name
      - phone_number
    ChangeEmail:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          maxLength: 128
      required:
      - email
      - password
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        clear_other_sessions:
          type: boolean
          default: false
      required:
      - current_password
      - new_password
    ChangeRole:
      type: object
      properties:
        role:
          enum:
          - admin
          - member
          type: string
      required:
      - role
    ChargebeeSubscription:
      type: object
      properties:
        plan_id:
          type: string
          readOnly: true
          nullable: true
        status:
          enum:
          - a
          - t
          - e
          - c
          - p
          type: string
          readOnly: true
        trial_end:
          type: string
          format: date-time
          readOnly: true
        billing_period_unit:
          type: string
          readOnly: true
          nullable: true
        current_term_start:
          type: string
          nullable: true
          readOnly: true
        current_term_end:
          type: string
          nullable: true
          readOnly: true
        unpaid_invoices:
          type: integer
          readOnly: true
        max_allowed_unpaid_invoices:
          type: integer
          readOnly: true
        can_extend_trial:
          type: boolean
          description: |-
            Determine whether the trial period can be extended.

            This property checks the current status and conditions of the subscription
            to determine if the trial period is eligible for an extension.

            Returns:
                bool: True if the trial can be extended based on the current subscription
                conditions, otherwise False.
          readOnly: true
        subscribed_on:
          type: string
          readOnly: true
        documents_allowed:
          type: integer
          readOnly: true
        trial_signatures_allowed:
          type: integer
          readOnly: true
        signatures_allowed:
          type: integer
          readOnly: true
        signnow_credits_allowed:
          type: integer
          readOnly: true
      required:
      - billing_period_unit
      - can_extend_trial
      - current_term_end
      - current_term_start
      - documents_allowed
      - max_allowed_unpaid_invoices
      - plan_id
      - signatures_allowed
      - signnow_credits_allowed
      - status
      - subscribed_on
      - trial_end
      - trial_signatures_allowed
      - unpaid_invoices
    CreateInvitation:
      type: object
      properties:
        email:
          type: string
        role:
          enum:
          - admin
          - manager
          - member
          - billing_manager
          type: string
        workspace:
          type: integer
      required:
      - email
      - role
      - workspace
    CreateWorkspaceInvitation:
      type: object
      properties:
        email:
          type: string
        role:
          enum:
          - admin
          - manager
          - member
          - billing_manager
          type: string
      required:
      - email
      - role
    DemoGraphic:
      type: object
